name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Third-party actions are pinned to a commit, and the token they get can only read.
permissions:
  contents: read

jobs:
  lint:
    name: ShellCheck + syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Bash syntax check
        run: |
          bash -n arise.sh
          bash -n ascend.sh
          bash -n reawaken.sh
          bash -n system.sh
          bash -n lib/hexis.sh
          bash -n lib/firedancer.sh
          bash -n lib/remote.sh
          bash -n test/run.sh

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: "."
          severity: warning

  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run tests
        run: ./test/run.sh

  smoke:
    name: CLI smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Help flag prints usage and exits 0
        run: |
          for script in arise.sh ascend.sh reawaken.sh system.sh; do
            ./"$script" -h | grep -q "Usage:"
          done

      - name: Missing --host fails with clear error
        run: |
          output=$(./arise.sh 2>&1 || true)
          echo "$output" | grep -q -- "--host is required" || {
            echo "Expected '--host is required' error, got:"
            echo "$output"
            exit 1
          }

      - name: Unknown flag fails
        run: |
          output=$(./arise.sh --nonsense-flag foo 2>&1 || true)
          echo "$output" | grep -q "Unknown option" || {
            echo "Expected 'Unknown option' error, got:"
            echo "$output"
            exit 1
          }

      - name: ascend.sh requires a mode
        run: |
          output=$(./ascend.sh --host 1.2.3.4 2>&1 || true)
          echo "$output" | grep -q "must be 'upgrade', 'migrate' or 'promote'" || {
            echo "Expected mode error, got:"
            echo "$output"
            exit 1
          }

      - name: ascend.sh requires a binary source
        run: |
          fake_key=$(mktemp)
          trap 'rm -f "$fake_key"' EXIT
          output=$(./ascend.sh upgrade --host 1.2.3.4 --ssh-key "$fake_key" 2>&1 || true)
          echo "$output" | grep -q -- "--hexis-tag or --hexis-binary is required" || {
            echo "Expected binary-source error, got:"
            echo "$output"
            exit 1
          }

      - name: Invalid network value fails
        run: |
          # Create throwaway files so --ssh-key/--identity file-exists checks pass
          fake_key=$(mktemp)
          fake_identity=$(mktemp)
          trap 'rm -f "$fake_key" "$fake_identity"' EXIT

          output=$(./arise.sh \
            --host 1.2.3.4 \
            --ssh-key "$fake_key" \
            --identity "$fake_identity" \
            --vote-account VOTEXXX \
            --network bogus 2>&1 || true)
          echo "$output" | grep -q "must be 'testnet' or 'mainnet'" || {
            echo "Expected network validation error, got:"
            echo "$output"
            exit 1
          }
